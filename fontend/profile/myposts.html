<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài viết của tôi</title>
    <link rel="stylesheet" href="./myposts.css">
</head>
<body>
    <main>
        <h2>Bài viết của tôi</h2>
        <p id="message"></p>

        <table id="postTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tiêu đề</th>
                    <th>Nội dung</th>
                    <th>Ngày đăng</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="postTableBody">
                <tr>
                    <td colspan="5">Loading...</td>
                </tr>
            </tbody>
        </table>

        <div class="footer-actions">
            <button id="backBtn" type="button">Quay lại</button>
        </div>

        <div id="editModal" class="modal hidden">
            <div class="modal-content">
                <h3>Sửa bài viết</h3>
                <form id="editForm">
                    <label for="editTitle">Tiêu đề</label>
                    <input id="editTitle" type="text" required>

                    <label for="editContent">Nội dung</label>
                    <textarea id="editContent" rows="5" required></textarea>

                    <div class="modal-actions">
                        <button type="submit">Lưu</button>
                        <button id="closeEditBtn" type="button">Hủy</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="./myposts.js"></script>
</body>
</html>
