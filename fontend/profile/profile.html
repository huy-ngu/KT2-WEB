<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h2>Thông tin cá nhân</h2>

    <div class="profile-card">
      <div class="row">
        <span class="label">ID:</span>
        <span id="userId">-</span>
      </div>
      <div class="row">
        <span class="label">Username:</span>
        <span id="username">-</span>
      </div>
      <div class="row">
        <span class="label">Role:</span>
        <span id="role">-</span>
      </div>
    </div>

    <p id="message"></p>

    <div class="actions">
      <button id="backBtn" type="button">Quay lại</button>
      <button id="myPostsBtn" type="button">Bài viết của tôi</button>
      <button id="changePasswordBtn" type="button">Đổi mật khẩu</button>
      <button id="logoutBtn" type="button">Đăng xuất</button>
    </div>

    <!-- Modal Đổi Mật Khẩu -->
    <div id="changePasswordModal" class="modal">
      <div class="modal-content">
        <h3>Đổi mật khẩu</h3>
        <form id="changePasswordForm">
          <div class="form-group">
            <label for="oldPassword">Mật khẩu cũ:</label>
            <input type="password" id="oldPassword" required />
          </div>
          <div class="form-group">
            <label for="newPassword">Mật khẩu mới:</label>
            <input type="password" id="newPassword" required />
          </div>
          <p id="modalMessage" class="modal-message"></p>
          <div class="modal-actions">
            <button type="submit" id="submitPasswordBtn">Xác nhận</button>
            <button type="button" id="closeModalBtn">Hủy</button>
          </div>
        </form>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
