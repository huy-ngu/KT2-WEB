<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h2>Danh sách bài đăng</h2>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Tìm kiếm..." />
      <button id="openCreateModalBtn" type="button">Thêm bài đăng</button>
    </div>

    <table id="postTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>

    <div class="pagination">
      <button id="prevBtn" type="button">Prev</button>
      <span id="pageInfo"></span>
      <button id="nextBtn" type="button">Next</button>
    </div>

    <p id="message"></p>

    <div class="footer-actions">
      <button id="profileBtn" type="button">Profile</button>
      <button id="logoutBtn" type="button">Đăng xuất</button>
    </div>

    <div id="createPostModal" class="modal hidden">
      <div class="modal-content">
        <h3>Thêm post mới</h3>
        <form id="createPostForm">
          <input type="text" id="createTitle" placeholder="Title" required />
          <textarea
            id="createContent"
            placeholder="Content"
            rows="4"
            required
          ></textarea>
          <div class="modal-actions">
            <button type="submit">Lưu</button>
            <button type="button" id="closeCreateModalBtn">Đóng</button>
          </div>
        </form>
      </div>
    </div>

    <div id="updatePostModal" class="modal hidden">
      <div class="modal-content">
        <h3>Cập nhật post</h3>
        <form id="updatePostForm">
          <input type="text" id="updateTitle" placeholder="Title" required />
          <textarea
            id="updateContent"
            placeholder="Content"
            rows="4"
            required
          ></textarea>
          <div class="modal-actions">
            <button type="submit">Cập nhật</button>
            <button type="button" id="closeUpdateModalBtn">Đóng</button>
          </div>
        </form>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
